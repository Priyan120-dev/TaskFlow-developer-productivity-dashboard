services:
  # ===================================================
  # TaskFlow Frontend — React Vite SPA (Static Site)
  # ===================================================
  - type: web
    name: taskflow-app
    runtime: static
    buildCommand: npm install && chmod +x node_modules/.bin/vite && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback rewrite: all unmatched client routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_NAME
        value: TaskFlow
      - key: VITE_APP_VERSION
        value: 1.0.0

  # ===================================================
  # TaskFlow Backend — Express REST API (Web Service)
  # ===================================================
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: taskflow-api
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
